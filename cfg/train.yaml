hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}-${task.name}-${algo.name}
  job:
    chdir: true

headless: true
exp_name: ${oc.select:task.name,test}-${oc.select:algo.name,none}

app:
  headless: ${..headless}
  enable_cameras: ${oc.select:..task.enable_cameras,${..eval_render}}

total_frames: 800_000_000
# total_frames: 500_000_000
# total_frames: 300_000_000
# total_frames: 150_000_000
# total_frames: 100_000_000
eval_render: false
save_interval: 300
seed: 0
checkpoint_path: null
# Optional explicit teacher H5 used with checkpoint_path. This top-level alias
# is copied to algo.teacher_buffer_path before checkpoint/replay resolution.
teacher_replay_buffer_path: null
vecnorm: ${oc.select:algo.vecnorm,train}

camera_follow: true

# Disabled-by-default, short-window CUDA-event profiler. For dynamic DAgger,
# `phase: main_dagger` makes start_rollout=0 mean the first Student/main rollout
# after the deterministic Teacher prefill, independent of prefill duration.
wallclock_profile:
  enabled: false
  label: ""
  phase: physical # physical | teacher_prefill | main_dagger
  start_rollout: 0
  num_rollouts: 4
  cuda_events: true
  # Separate one-rollout audit only: counts host scalar extraction and CUDA
  # synchronization events, but torch.profiler perturbs low-overhead timing.
  torch_profiler_sync_audit: false
  nvml_sample_interval_s: 0.2
  output_filename: wallclock_profile.json
  # Profile-only convenience: omit the long final evaluation after training.
  skip_final_evaluation: false
  # Separately time the already-required final save plus a CPU-only load probe.
  profile_final_checkpoint: false

wandb:
  name: ${..exp_name}/${now:%m-%d}_${now:%H-%M}
  job_type: train
  project: haic
  mode: online # set to 'disabled' when debugging locally
  tags: []
  # Teacher replay files are commonly 20+ GiB. Keep them local unless an
  # explicit one-off run opts into the large W&B upload.
  upload_teacher_replay: false

defaults:
  - task: G1/G1Track-walk
  - algo: ppo
  - _self_
