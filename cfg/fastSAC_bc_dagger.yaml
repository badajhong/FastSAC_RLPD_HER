# Dedicated fresh-only distributional FastSAC + Teacher-BC DAgger defaults.
# The shared trainer owns simulation, rollout batching, checkpoint writing, and
# evaluation.  This method adds a teacher-only replay prefill before the
# explicitly requested number of main DAgger rollouts.
defaults:
  - train
  - override /algo: fastsac_bc_dagger_finetune
  - _self_

# Number of parallel simulator environments. Override from the command line
# with `task.num_envs=<count>` when a different rollout batch size is needed.
task:
  num_envs: 256

# This placeholder is always replaced from fastsac_dagger_iterations before
# simulator startup. Runtime reserves the bounded dynamic-prefill allowance,
# then exits after the exact main-rollout budget instead of consuming it all.
total_frames: 19_660_800
fastsac_dagger_iterations: null
save_interval: 100

# Same-stage replay/checkpoint continuation is intentionally unsupported.  A
# run must start from the train-phase PPO checkpoint_path inherited from
# train.yaml and collect a new raw-perception replay lineage.
fastsac_bc_dagger_checkpoint: null

algo:
  # Main rollout uses one fixed, seeded environment partition. DAgger envs
  # alternate Student/Teacher execution from a Student first step after every
  # reset; the complementary envs always execute Student. The frozen Expert Q
  # ring is populated separately by the successful-only prefill below.
  dagger_control_mode: beta
  dagger_safe_takeover_rms: 0.006
  dagger_safe_release_rms: 0.004
  dagger_safe_min_teacher_steps: 8
  dagger_safe_zero_iteration: null
  dagger_beta_start: 0.0
  dagger_beta_end: 0.0
  dagger_beta_zero_iteration: null
  dagger_beta_decay_rollouts: 500
  dagger_seed: 0
  # Fraction of vector environments assigned to the fixed mixed-control DAgger
  # cohort. Both cohorts must be non-empty; 0.5 gives 256/256 at num_envs=512.
  dagger_env_fraction: 0.5
  # Shared finite raw-command support for behavior, targets, replay, BC, and Q.
  # Nominal per-joint limits remain normalization/entropy coordinates.
  action_support_clip: 20.0

  # Joint-wise normalized Teacher BC is applied only to the noise-free mean.
  # One optimizer handles this term and the reparameterized SAC objective.
  dagger_bc_lr: 3.0e-4
  dagger_actor_huber_delta: 1.0
  # Explicit capacities for the two independent online rings. The DAgger ring
  # stores every transition from the alternating Student/Teacher cohort; the
  # Student ring stores only transitions from the pure-Student cohort. Keeping
  # both at 65,536 preserves the former 131,072-row total online allocation.
  dagger_buffer_capacity: 65_536
  student_buffer_capacity: 65_536
  dagger_buffer_device: cpu
  dagger_batch_size: 4096
  # Keep collecting successful Teacher episodes until the frozen Teacher Q
  # ring reaches q_teacher_buffer_capacity. This is only a fail-fast safety
  # ceiling; failed and timed-out trajectories never reach frozen replay.
  # Source fractions change sampling/loss weights, not this ring's allocation.
  teacher_prefill_max_rollouts: 1000
  # Actor replay accepts an independent Expert share. Within its remaining
  # online share, this conditional fraction comes from mixed-control DAgger;
  # the complement comes from the pure-Student ring. Perception instead uses
  # complete live recurrent sequences selected by perception_live_env_scope.
  teacher_actor_replay_fraction: 0.5
  actor_online_dagger_replay_fraction: 0.5
  teacher_perception_replay_fraction: 0.0
  # Preferred single perception-data selector. Use ``pure_student`` for the
  # historical Student-only cohort, ``all`` for every live environment, or
  # ``four_way`` for replay-based perception. Null preserves legacy commands
  # that still set the two internal fields below.
  perception_training_source: null
  perception_replay_mode: online_student_rollout
  # ``pure_student`` preserves the historical on-policy cohort. ``all`` uses
  # complete live sequences from both pure-Student and mixed-control DAgger
  # environments; neither setting samples perception data from replay.
  perception_live_env_scope: pure_student
  failure_phase_teacher_fraction: 0.3
  # Each failed Student episode contributes ten evenly spaced reference-phase
  # samples from the inclusive [done - 50, done] interval.  The histogram is
  # phase-indexed rather than a second Student pre-failure replay partition.
  failure_phase_lookback_steps: 50
  failure_phase_samples_per_failure: 10
  failure_phase_num_bins: 1024
  dagger_replay_raw_observations: true
  replay_raw_observation_keys:
    - vel_command
    - policy
    - priv
    - command
    - depth
  perception_replay_burn_in: 8
  # Larger replay encoding chunks reduce kernel-launch overhead on the target
  # RTX 5090 while preserving identical samples and gradients. Lower to 256 if
  # a smaller GPU cannot accommodate the temporary activation memory.
  perception_encode_microbatch_size: 512
  teacher_perception_batch_size: 128
  # Teacher-only perception warm-up is disabled by the live Student contract.
  teacher_perception_warmup_steps: 0
  perception_depth_codec: uint8_div_100_v1
  # Optional perception warm start.  A Student checkpoint must contain the
  # complete online + EMA depth/object/adaptation stack.  Alternatively this
  # may equal the train-phase PPO checkpoint_path: PPOVEL-compatible loading
  # then restores its object/adaptation online + EMA modules, initializes the
  # absent depth CNN/GRU modules freshly, and requires train_perception=true.
  # With live-only perception and zero Teacher warm-up, that partial case has
  # the same fresh-depth first rollout as PPOVEL finetune by design.
  load_pretrained_perception: false
  perception_checkpoint_path: null
  # Disable only to freeze a successfully loaded complete perception stack.
  train_perception: true

  # Student actor_adapt mean initialization at the fresh PPO-source boundary.
  # teacher_bc preserves the checkpoint-trained BC mean; fresh keeps the
  # constructor mean while the privileged Teacher still loads and remains
  # frozen. In both modes PPO actor_std is reset by algo.load_noise_scale.
  student_actor_initialization: teacher_bc
  # Optional actor_adapt-only initialization from scripts/percetpion_actor.py.
  # The public ``adopt`` spelling is intentional. The privileged Teacher still
  # comes only from root checkpoint_path; this source never overlays Teacher,
  # perception, Q, or Critic tensors. It requires teacher_bc initialization and
  # an explicit pretrained perception checkpoint.
  actor_adopt_checkpoint_path: null

  # ``c51`` preserves the engineered split-action distributional critic.
  # ``scalar`` uses independent standard-SAC Q heads with balanced state/action
  # stems, followed by two shared-width hidden layers and one scalar output.
  # ``distributional`` keeps those exact scalar-style inputs and hidden layers
  # but replaces only the final scalar with the categorical C51 atom logits.
  q_critic_type: c51
  # Shared Q1/Q2 reduction for both Actor and bootstrap targets. ``min`` keeps
  # clipped double-Q. ``mean`` averages scalar values or mixes the two complete
  # C51 probability distributions with equal weight.
  q_twin_reduction: min
  # Locked support for both categorical modes (retained as inactive
  # compatibility metadata in scalar mode), with an independently configurable
  # Teacher/Student replay mixture.
  q_hidden_dim: 768
  q_num_atoms: 501
  q_v_min: -20.0
  q_v_max: 20.0
  # These two topology knobs apply only to engineered ``c51``. ``scalar`` and
  # ``distributional`` always use fixed balanced stems and no LayerNorm.
  q_layer_norm: true
  q_action_fusion: late
  q_action_coordinates: raw_joint_command
  q_normalize_actions: true
  q_action_input_gain: 1.0
  # Requires q_condition_on_actuator_state=true. Engineered ``c51`` receives
  # delta/effect features. Both split-stem modes use this flag only to retain
  # the normalized previous issued action as detached state context.
  q_use_predicted_effect: false
  # Zero-initialized bounded FiLM of the Q action stem, conditioned only on
  # delay one-hot and centered actuator alpha. Requires actuator context and
  # late/balanced action fusion; unavailable to both split-stem modes.
  q_use_residual_film: false
  q_residual_film_scale: 0.1
  q_lr: 3.0e-5
  q_weight_decay: 1.0e-3
  q_seed: 0
  q_tau: 0.005
  q_max_grad_norm: 1.0
  q_batch_size: 512
  # Spend this many total Q sample rows per newly accepted Student replay row.
  # The row-credit scheduler preserves fractional credit for arbitrary rollout
  # chunking. q_updates_per_rollout is used only when this ratio is null.
  q_updates_per_rollout: 32
  q_update_to_data_ratio: 1.0
  # Fraction of each Q batch drawn from frozen Expert replay. The remainder is
  # online data; its conditional DAgger/pure-Student split is controlled by the
  # second value. Counts use deterministic half-up rounding.
  q_teacher_replay_ratio: 0.5
  q_online_dagger_replay_fraction: 0.5
  q_teacher_buffer_capacity: 131_072

  # FastSAC owns exploration through its learned squashed Gaussian.  These
  # inherited TD3 controls are locked inert to prevent a second noise source.
  eta_td3: 0.0
  # At the standard 512-env rollout this keeps four Actor updates while Q uses
  # all 32 row-credit updates.  The Actor cadence scales with new data too.
  policy_delay: 8
  target_policy_noise_std: 0.0
  target_policy_noise_clip: 0.0
  collector_exploration_noise_std: 0.0
  collector_exploration_noise_clip: 0.0
  td3_learning_starts: 8192

  # Policy distribution. ``normalized_tanh`` is the bounded FastSAC policy:
  # it uses the nominal per-joint action interval shared with Q normalization,
  # so sampled, executed, replayed, and Actor-Q actions stay on one support.
  # ``ppo_physical_gaussian`` uses PPOVEL's raw physical-action Normal and
  # direct joint-wise actor_std. Teacher and Student then share physical action
  # coordinates; the common execution clamp remains the final safety guard.
  # Teacher BC, when enabled, uses the execution-valid physical label directly.
  # Fixed-temperature and autotuned SAC are both valid.
  eta_sac: 1.0e-4
  lambda_bc: 1.0
  # Optional low-memory SPReD-P weighting: use the online twin Critic's
  # ensemble mean/sample-std to assign each valid Teacher label a continuous
  # Gaussian-CDF weight. The weight is detached from the Actor gradient.
  use_q_filtered_bc: false
  sac_actor_lr: 3.0e-4
  # Independent from q_weight_decay. Zero makes an exact zero-gradient
  # SAC+BC Actor update a true no-op instead of shrinking the pretrained mean.
  sac_actor_weight_decay: 0.0
  sac_action_distribution: normalized_tanh
  # Physical Gaussian only: the ordinary SAC alpha*logpi-Q objective controls
  # actor_std; Teacher BC remains mean-only. A separate small-LR Adam and hard
  # bounds slow its movement, while the rollout-old std-only KL cap guards
  # against abrupt changes without imposing a fixed target or checkpoint prior.
  sac_physical_std_lr: 1.0e-5
  sac_physical_std_max_kl: 0.01
  # ``uniform_physical`` applies the scalar interval below exactly as before.
  # ``q_normalized`` additionally intersects it with q_action_scale times the
  # normalized interval, giving each joint a comparable dimensionless envelope.
  sac_physical_std_bound_mode: uniform_physical
  sac_physical_std_min: 0.05
  sac_physical_std_max: 0.5
  sac_physical_std_normalized_min: 0.02
  sac_physical_std_normalized_max: 0.11
  # The next three fields apply only to normalized_tanh.
  sac_initial_action_std: 0.1
  sac_log_std_min: -10.0
  sac_log_std_max: -2.0
  sac_alpha_init: 1.0e-5
  sac_alpha_lr: 2.0e-5
  sac_use_autotune: true
  # Lock autotune to the delayed Actor cadence, not every Critic update.
  sac_alpha_update_cadence: actor
  # Normalized target = -action_dim * ratio. Values above one intentionally
  # request lower entropy; the skateboard's 23 actions give -46 at ratio 2.
  sac_target_entropy_ratio: 1.0
  sac_policy_frequency: 8
  sac_learning_starts: 8192
  sac_tau: 0.005
  sac_max_grad_norm: 1.0

  # Raw recurrent windows stay only in the two online learning rings.  No H5
  # teacher replay is exported, restored, or uploaded.
  save_teacher_buffer: false

wandb:
  project: vaic_dagger
