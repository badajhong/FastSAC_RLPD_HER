# Dedicated fresh-only distributional FastSAC + Teacher-BC DAgger defaults.
# The shared trainer owns simulation, rollout batching, checkpoint writing, and
# evaluation.  This method adds a teacher-only replay prefill before the
# explicitly requested number of main DAgger rollouts.
defaults:
  - train
  - override /algo: fastsac_bc_dagger_finetune
  - _self_

# Number of parallel simulator environments. Override from the command line
# with `task.num_envs=<count>` when a different rollout batch size is needed.
task:
  num_envs: 256

# This placeholder is always replaced from fastsac_dagger_iterations before
# simulator startup. Runtime reserves the bounded dynamic-prefill allowance,
# then exits after the exact main-rollout budget instead of consuming it all.
total_frames: 19_660_800
fastsac_dagger_iterations: null
save_interval: 100

# Same-stage replay/checkpoint continuation is intentionally unsupported.  A
# run must start from the train-phase PPO checkpoint_path inherited from
# train.yaml and collect a new raw-perception replay lineage.
fastsac_bc_dagger_checkpoint: null

algo:
  # Main rollout defaults to the stochastic Student immediately.  The frozen
  # Teacher Q ring is populated separately by the prefill below; Teacher labels
  # are still queried during main rollout for the mean-action BC objective.
  dagger_control_mode: beta
  dagger_safe_takeover_rms: 0.006
  dagger_safe_release_rms: 0.004
  dagger_safe_min_teacher_steps: 8
  dagger_safe_zero_iteration: null
  dagger_beta_start: 0.0
  dagger_beta_end: 0.0
  dagger_beta_zero_iteration: null
  dagger_beta_decay_rollouts: 500
  dagger_seed: 0
  # Shared finite raw-command support for behavior, targets, replay, BC, and Q.
  # Nominal per-joint limits remain normalization/entropy coordinates.
  action_support_clip: 20.0

  # Joint-wise normalized Teacher BC is applied only to the noise-free mean.
  # One optimizer handles this term and the reparameterized SAC objective.
  dagger_bc_lr: 3.0e-4
  dagger_actor_huber_delta: 1.0
  dagger_buffer_capacity: 131_072
  dagger_buffer_device: cpu
  dagger_batch_size: 4096
  # Keep collecting successful Teacher episodes until the frozen Teacher Q
  # ring reaches q_teacher_buffer_capacity. This is only a fail-fast safety
  # ceiling; failed and timed-out trajectories never reach frozen replay.
  # Source fractions change sampling/loss weights, not this ring's allocation.
  teacher_prefill_max_rollouts: 1000
  # Actor replay accepts an independent Teacher share. Perception is different:
  # it follows PPOVEL finetune exactly and learns only from the current live
  # recurrent Student rollout, never from either replay ring.
  teacher_actor_replay_fraction: 0.5
  teacher_perception_replay_fraction: 0.0
  perception_replay_mode: online_student_rollout
  failure_phase_teacher_fraction: 0.3
  # Each failed Student episode contributes ten evenly spaced reference-phase
  # samples from the inclusive [done - 50, done] interval.  The histogram is
  # phase-indexed rather than a second Student pre-failure replay partition.
  failure_phase_lookback_steps: 50
  failure_phase_samples_per_failure: 10
  failure_phase_num_bins: 1024
  dagger_replay_raw_observations: true
  replay_raw_observation_keys:
    - vel_command
    - policy
    - priv
    - command
    - depth
  perception_replay_burn_in: 8
  # Larger replay encoding chunks reduce kernel-launch overhead on the target
  # RTX 5090 while preserving identical samples and gradients. Lower to 256 if
  # a smaller GPU cannot accommodate the temporary activation memory.
  perception_encode_microbatch_size: 512
  teacher_perception_batch_size: 128
  # Teacher-only perception warm-up is disabled by the live Student contract.
  teacher_perception_warmup_steps: 0
  perception_depth_codec: uint8_div_100_v1
  # Optional perception warm start.  A Student checkpoint must contain the
  # complete online + EMA depth/object/adaptation stack.  Alternatively this
  # may equal the train-phase PPO checkpoint_path: PPOVEL-compatible loading
  # then restores its object/adaptation online + EMA modules, initializes the
  # absent depth CNN/GRU modules freshly, and requires train_perception=true.
  # With live-only perception and zero Teacher warm-up, that partial case has
  # the same fresh-depth first rollout as PPOVEL finetune by design.
  load_pretrained_perception: false
  perception_checkpoint_path: null
  # Disable only to freeze a successfully loaded complete perception stack.
  train_perception: true

  # Locked twin 501-atom distributional Critic with an independently
  # configurable frozen-Teacher / main-Student replay mixture.
  q_hidden_dim: 768
  q_num_atoms: 501
  q_v_min: -20.0
  q_v_max: 20.0
  q_layer_norm: true
  q_action_fusion: late
  q_action_coordinates: raw_joint_command
  q_normalize_actions: true
  q_action_input_gain: 1.0
  q_lr: 3.0e-5
  q_weight_decay: 1.0e-3
  q_seed: 0
  q_tau: 0.005
  q_max_grad_norm: 1.0
  q_batch_size: 512
  # Spend one total Q sample row per newly accepted Student replay row.  The
  # row-credit scheduler gives 32 Q updates for a 512-env x 32-step rollout,
  # 16 for 256 envs, and preserves fractional credit for arbitrary chunking.
  # q_updates_per_rollout remains serialized for compatibility with the shared
  # TD3 base; this dedicated FastSAC entrypoint locks the row ratio to 1.0.
  q_updates_per_rollout: 32
  q_update_to_data_ratio: 1.0
  # Fraction of each Q batch drawn from frozen Teacher replay; the remainder
  # is sampled from Student-executed replay. Any finite value in [0, 1] is valid;
  # the Teacher row count is floor(q_batch_size * ratio + 0.5).
  q_teacher_replay_ratio: 0.5
  q_teacher_buffer_capacity: 131_072

  # FastSAC owns exploration through its learned squashed Gaussian.  These
  # inherited TD3 controls are locked inert to prevent a second noise source.
  eta_td3: 0.0
  # At the standard 512-env rollout this keeps four Actor updates while Q uses
  # all 32 row-credit updates.  The Actor cadence scales with new data too.
  policy_delay: 8
  target_policy_noise_std: 0.0
  target_policy_noise_clip: 0.0
  collector_exploration_noise_std: 0.0
  collector_exploration_noise_clip: 0.0
  td3_learning_starts: 8192

  # Reparameterized bounded Actor. Standard deviation is dimensionless in the
  # same per-joint nominal coordinates used by Q, BC, and entropy.
  eta_sac: 1.0e-4
  lambda_bc: 1.0
  sac_actor_lr: 3.0e-4
  sac_initial_action_std: 0.1
  sac_log_std_min: -10.0
  sac_log_std_max: -2.0
  sac_alpha_init: 1.0e-5
  sac_alpha_lr: 2.0e-5
  sac_use_autotune: true
  # Lock autotune to the delayed Actor cadence, not every Critic update.
  sac_alpha_update_cadence: actor
  # Normalized target = -action_dim * ratio. Values above one intentionally
  # request lower entropy; the skateboard's 23 actions give -46 at ratio 2.
  sac_target_entropy_ratio: 1.0
  sac_policy_frequency: 8
  sac_learning_starts: 8192
  sac_tau: 0.005
  sac_max_grad_norm: 1.0

  # Raw recurrent windows stay only in the two online learning rings.  No H5
  # teacher replay is exported, restored, or uploaded.
  save_teacher_buffer: false

wandb:
  project: vaic_dagger
