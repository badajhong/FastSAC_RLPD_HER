# Dedicated defaults for scripts/bc_dagger.py. The complete training schema is
# inherited from train.yaml so rollout, replay, checkpoint, and W&B behavior
# remain identical to scripts/train.py. Current compatible artifacts are
# BC-DAgger algorithm v6, Stage-2 adapter v6, and teacher H5 format v5.
defaults:
  - train
  - override /algo: ppo_bc_dagger_finetune
  - _self_

# Four-hour single-GPU schedule calibrated from the full skateboard DAgger run
# with 512 environments and train_every=32 (~5.88 s/rollout). SafeDAgger now
# assigns control state-by-state for all 2,400 rollouts; the beta schedule below
# remains available for beta/hybrid ablations. Wall time can still vary with
# machine load and final H5/W&B I/O. Save a model checkpoint every 100 outer
# rollout iterations. With inline finalization enabled, only checkpoint_final
# is paired with an H5 and is ready for Stage 2; partial checkpoints are for
# evaluation/debugging and intentionally are not exact-resume sources.
total_frames: 39_321_600
# Optional, preferred iteration-facing budget. When set, the dedicated
# entrypoint replaces total_frames with
# bc_dagger_iterations * task.num_envs * algo.train_every * world_size, matching
# train.py's global-frame convention. With inline finalization this is the
# joint-training budget; the perception/actor/Q tail below is appended. On
# legacy same-stage resume this is the number of additional iterations.
bc_dagger_iterations: null

# Finish the ordinary joint BC-DAgger run inside this same process:
#   joint actor+perception+Q
#   -> pure-student perception consolidation with the actor frozen
#   -> pure-student actor BC with all perception modules frozen
#   -> beta=0.5 Q-only calibration with actor/perception frozen
# The calibration teacher rows are retained in memory, then materialized to H5
# exactly once when checkpoint_final is saved. Set this false to recover the
# legacy joint-only schedule and periodic H5 snapshots/resume contract.
# The zero perception default assumes joint training already contains a long
# pure-student tail (for example beta control with beta_zero_iteration reached).
bc_dagger_inline_finalization: true
perception_consolidation_iterations: 0
actor_realignment_iterations: 50
replay_q_calibration_iterations: 128
calibration_teacher_probability: 0.5
save_interval: 100

# Optional same-stage continuation checkpoint. Unlike checkpoint_path (which
# normally bootstraps a fresh DAgger stage from the PPO teacher), this must be a
# PPO-BC DAgger SAC-critic-v6 checkpoint paired with H5 format v5. It restores
# actor/perception/EMA,
# Q1/Q2, target Q1/Q2, all training optimizers, and the dedicated
# DAgger/replay/stochastic-target RNG streams,
# and stage counters while deliberately leaving the previously exported
# teacher_replay_buffer.h5 immutable. bc_dagger_iterations (when set) is the
# number of *additional* iterations to run; otherwise total_frames remains the
# additional global frame budget. This legacy resume path requires
# bc_dagger_inline_finalization=false because inline partial checkpoints have no
# paired H5 by design.
bc_dagger_checkpoint: null
# Copy the compatible immutable H5 to the new Hydra output root, outside W&B's
# watched files directory. This is a real independent copy (about 23 GiB for
# the current skateboard replay), not a link. Disabling the copy avoids disk
# duplication, but the source H5 is still required to refill the in-memory
# fixed teacher critic partition on resume.
bc_dagger_copy_teacher_replay: true
# Internal guard set only after scripts/bc_dagger.py validates the checkpoint.
_bc_dagger_model_only_resume: false
_bc_dagger_teacher_replay_copy_source: null
_bc_dagger_teacher_replay_copy_path: null
# Set only after the dedicated entrypoint validates a fresh train-phase PPO
# source. It prevents generic replay auto-discovery from importing an adjacent
# H5 into a brand-new BC-DAgger collection.
_bc_dagger_fresh_source: false

algo:
  # Oracle-discrepancy SafeDAgger: project deterministic teacher/student means
  # into the shared +/-20 behavior envelope, then divide their difference by
  # 20. RMS > 0.006 takes over; after an 8-control-step minimum hold, RMS <
  # 0.004 releases back to the student.
  dagger_control_mode: safe
  dagger_safe_takeover_rms: 0.006
  dagger_safe_release_rms: 0.004
  dagger_safe_min_teacher_steps: 8
  # Defines the BC actor/environment/replay/H5 execution envelope. It is also
  # the /20 SafeDAgger discrepancy scale, but it is not the Q or entropy scale.
  # Stage 2 further restricts every action to a frozen-BC-centered residual of
  # at most one nominal joint half-range while remaining inside this envelope.
  dagger_action_clip: 20.0
  # Optional project-specific safety override. With K, rollout indices 0..K-1
  # retain SafeDAgger and index K onward disables safe teacher execution. The
  # frozen teacher is still queried for DAgger labels and discrepancy logging.
  dagger_safe_zero_iteration: null
  # Used only when dagger_control_mode is beta or hybrid.
  dagger_beta_start: 1.0
  dagger_beta_end: 0.0
  # Preferred CLI control: after this many cumulative DAgger rollouts have been
  # completed, beta is exactly zero (rollout index K onward). Null keeps the
  # legacy decay setting below.
  dagger_beta_zero_iteration: null
  dagger_beta_decay_rollouts: 1800
  # Actor training remains pure DAgger BC. Q uses the exact Stage-2 critic
  # topology/operator with physical actions, unclipped nominal-joint Q
  # coordinates, a BC-centered bounded-residual stochastic next action, and
  # beta-independent 50/50 replay. Entropy density uses the same nominal scale.
  q_num_atoms: 501
  # Separate 2,341-D state and 23-D action stems; with q_hidden_dim=768 the
  # action branch is 128-D before the shared distributional-Q trunk.
  q_action_fusion: late
  q_action_coordinates: absolute
  sac_q_normalize_actions: true
  sac_q_action_input_gain: 1.0
  sac_clipped_double_q: true
  q_lr: 3.0e-5
  q_tau: 0.001
  q_batch_size: 512
  q_updates_per_rollout: 128
  # This is the fixed BC-DAgger Q-calibration cadence. Stage-2 UTD instead uses
  # algo.sac_update_to_data_ratio; sac_updates_per_env_step has been removed.
  q_teacher_replay_ratio: 0.5
  # Standard replay warm-up, not a critic-confidence gate. Both execution
  # sources must contain this many rows before exact 50/50 critic updates start.
  q_learning_starts_per_source: 8192
  # Centre-local physical std. The stored latent std is this value divided by
  # each joint's nominal residual half-range. State-dependent support can shrink
  # it further only when the BC anchor approaches the +/-20 safety envelope.
  sac_bc_initial_action_std: 0.01
  # Saved for the Stage-2 alpha process. BC critic Q-only targets use effective
  # alpha=0 while retaining BC-centered residual next-action sampling. Later
  # entropy density is expressed in nominal joint action coordinates.
  sac_alpha_init: 1.0e-5
  # Teacher-executed raw pre-VecNorm FIFO for the later FastSAC stage (about
  # 22 GiB when full with the current skateboard observation dimensions).
  teacher_buffer_capacity: 1_048_576

wandb:
  project: vaic_dagger
