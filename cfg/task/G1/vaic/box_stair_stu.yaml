# @package task
defaults:
  - base/hdmi-base
  - _self_

name: G1BoxStair

enable_cameras: true # student true, else false
camera_width: 64
camera_height: 36

num_envs: 512 # student 512, else 4096

viewer:
  env_spacing: 5.0
  lookat: [0.5, -2.5, 0.8]
  eye: [3, 2, 1.]

terrain: plane

robot:
  name: g1
  robot_type: g1_29dof_rubberhand-feet_box-eef_box-body_capsule

command:
  data_path: data/motion/g1/mirobotA/box_stair
  root_body_name: "pelvis"

  replay_motion: False

  reset_range: [0, 100]

  object_asset_name: "mybox"
  object_body_name:  "mybox"

  contact_eef_pos_offset:
    - [0.05, 0.0, 0.0]  # left wrist
    - [0.05, 0.0, 0.0]  # right wrist
  contact_target_pos_offset:
    - [-0.05, 0.18, 0.03]  # left wrist
    - [-0.05,-0.18, 0.03]  # right wrist

  extra_object_names: ["stairslope"]

observation:
  object_:
    object_pos_b:    {}
    object_ori_b:    {}
    extra_object_pos_b:    {}
    extra_object_ori_b:    {}
  object_geo_:
    object_points:    {}
    extra_object_points:    {}
  # Student observation: velocity command [vx, vy, vyaw] for locomotion-style control
  depth:
    depth_camera:
      camera_name: "tiled_camera"
      noise_std: 0.05                          # per-step gaussian depth noise (m)
      episode_noise_range: [-0.15, 0.15]       # episodic depth bias (m)
      delay_range: [0, 4]                      # frame delay range
      gaussian_filter_kernel_choices: [1, 3, 5]
      gaussian_filter_sigma_range: [1.0, 1.5]
  vel_command:
    ref_root_vel_future_b: {}
    ref_contact_flag_future: {}

randomization:
  object_body_randomization:
    static_dynamic_friction_ratio_range: [1.0, 2.0]
    dynamic_friction_range: [0.3, 0.8]
    restitution_range: [0.0, 0.2]
    mass_range: [1.0, 1.8]
  
  body_scale:
    name: ["mybox", "stairslope"]
    scale_range: [[0.9, 1.1], [0.98, 1.02]]
camera_dr:
  # Extrinsics: per-episode Gaussian noise on camera mount pose
  extrinsics_pos_noise_std: [0.01, 0.01, 0.01]  # (x, y, z) std in meters
  extrinsics_rot_noise_std: [0.01, 0.02, 0.01]     # (roll, pitch, yaw) std in radians (~1-2 deg)
  # Intrinsics: per-episode noise on focal length and aperture
  intrinsics_focal_length_noise_std: 0.02           # std relative to focal_length=1.0
  intrinsics_aperture_noise_std: 0.05               # std relative to horizontal_aperture

reward:
  # tracking:
  #   tracking_upper_body_pos(keypoint_pos_tracking_product):
  #     body_names: [".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
  #     weight: 0.5
  #     sigma: 0.5
  #   tracking_lower_body_pos(keypoint_pos_tracking_product):
  #     body_names: [".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link"]
  #     weight: 0.5
  #     sigma: 1.0

  #   tracking_upper_body_ori(keypoint_ori_tracking_product):
  #     body_names: [".*_shoulder_pitch_link", ".*_elbow_link", ".*_wrist_yaw_link"]
  #     weight: 0.5
  #     sigma: 0.5
  #   tracking_lower_body_ori(keypoint_ori_tracking_product):
  #     body_names: [".*_hip_pitch_link", ".*_knee_link", ".*_ankle_roll_link"]
  #     weight: 0.5
  #     sigma: 1.0
  feet:
    feet_air_time:      {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, thres: 0.3, soft_discount: 1.0}
    feet_air_lift:      {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, low_thres: 0.12, high_thres: 0.15, sigma: 0.25}
    feet_contact:       {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, sigma: 0.25}
  loco:
    joint_pos_limits:   {weight: 15.0, joint_names: ".*", soft_factor: 0.8, enabled: true}
    waist_pos_limits:   {weight: 15.0, enabled: true}