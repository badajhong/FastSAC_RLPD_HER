# TVKD extends the current fresh-only FastSAC + BC-DAgger configuration.
# The structured algo node below adds frozen Teacher-value shaping and the
# Teacher-value bottleneck replay while inheriting every existing rollout,
# replay, perception, randomization, C51, UTD, and target-update default.
defaults:
  - fastSAC_bc_dagger
  - override /algo: tvkd_fastsac_bc_dagger_finetune
  - _self_

# Optional TVKD checkpoint for model/optimizer/policy-RNG/bottleneck continuation.
# fastsac_dagger_iterations is the number of additional main rollouts. The
# raw DAgger, pure-Student, and Expert learning rings are intentionally rebuilt:
# the frozen Expert ring is refilled before main collection and both online rings
# warm up again, avoiding multi-gigabyte replay tensors in periodic checkpoints.
fastsac_bc_dagger_checkpoint: null
_tvkd_model_only_resume: false

algo:
  # Adds action supervision to the existing live perception backward. The
  # same Student actor supplies detached GT-latent targets and differentiable
  # predicted-latent actions, with its parameters frozen only for this forward.
  # SAC+BC actor updates remain active. Set to 1.0 to enable the new objective.
  perception_action_consistency_coef: 0.0
  # Add a 64 -> latent_dim zero-initialized projection of temporal depth to
  # the existing adaptation MLP feature, before the GRU and residual output.
  perception_depth_residual: false

  # Fresh TVKD runs inherit the parent FastSAC Actor-cadence temperature
  # update. A resumed v3 checkpoint may explicitly retain its saved Critic
  # cadence as a legacy compatibility contract.
  sac_alpha_update_cadence: actor

  # All three factual Q sources use the standard one-step SAC Bellman target.
  # This prevents a Student action in the alternating DAgger cohort from being
  # credited with a later Teacher rescue. Delayed actuation is represented in
  # the Critic observation/action history and propagated through bootstrapping.
  # Both fields are production locks: values other than 1 fail validation.
  q_n_step: 1
  q_teacher_n_step: 1

  # Resolved Q/Actor four-way replay mixtures. Each replay objective owns an
  # independent distribution whose four entries sum to exactly one. On a
  # fresh CLI launch, explicitly overriding q_teacher_replay_ratio,
  # teacher_actor_replay_fraction, or either failure-phase fraction derives
  # these values. Alternatively, override the canonical fields directly; do
  # not mix the two interfaces. Focused shortages backfill only into the
  # uniform source of the same provenance.
  q_uniform_student_fraction: 0.35
  q_failure_student_fraction: 0.15
  q_uniform_teacher_fraction: 0.35
  q_failure_teacher_fraction: 0.15

  actor_uniform_student_fraction: 0.35
  actor_failure_student_fraction: 0.15
  actor_uniform_teacher_fraction: 0.35
  actor_failure_teacher_fraction: 0.15

  # Perception matches PPOVEL finetune: train twice over the complete current
  # recurrent Student rollout and never sample perception rows from replay.
  perception_uniform_student_fraction: 1.0
  perception_failure_student_fraction: 0.0
  perception_uniform_teacher_fraction: 0.0
  perception_failure_teacher_fraction: 0.0
  perception_replay_mode: online_student_rollout

  # Diagnostic only, opt-in: set num_envs > 0 to journal a few live Student
  # episodes from their true reset and compare collection-time Actor inputs
  # against a current-EMA full re-encode. These rows never enter any optimizer
  # or replay sampler, so production training leaves the probe disabled.
  perception_staleness_probe_num_envs: 0
  perception_staleness_probe_max_episodes: 4
  perception_staleness_probe_max_generation_age: 8
  perception_staleness_probe_interval: 2

  # Physical-failure prevention curriculum: raw production residual MA(5),
  # three consecutive endpoints below -0.05, then only replay-valid Student
  # rows within the ten transition steps before onset. No onset/post-onset or
  # older-row backfill is allowed.
  bottleneck_threshold: 0.05
  bottleneck_smoothing_window: 5
  bottleneck_min_consecutive: 3
  bottleneck_terminal_exclusion_steps: 5
  failure_phase_lookback_steps: 10
  failure_phase_samples_per_failure: 10
  bottleneck_fallback_mode: none
  bottleneck_include_unsuccessful_timeouts: false
  max_teacher_phase_match_distance: null
