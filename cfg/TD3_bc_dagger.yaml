# Dedicated Phase-1 defaults for scripts/TD3_bc_dagger.py. The shared trainer
# owns rollout, environment, normalization, checkpoint writing, and evaluation.
# The algorithm is C51 distributional TD3 plus the exact existing Teacher-BC
# auxiliary objective; controller/source selection remains unchanged.
defaults:
  - train
  - override /algo: td3_bc_dagger_finetune
  - _self_

# Number of parallel simulator environments. Override from the command line
# with `task.num_envs=<count>` when a different rollout batch size is needed.
task:
  num_envs: 256

# Placeholder overwritten from the explicit main-rollout count. Runtime uses
# an upper bound that also covers teacher_prefill_max_rollouts; the shared
# runner exits early after the Teacher ring is full and the main budget ends.
total_frames: 19_660_800
td3_dagger_iterations: null
save_interval: 100

# Version 2 starts only from the train-phase PPO checkpoint_path inherited from
# train.yaml.  A non-null value here is retained solely for a clear fail-fast
# error; same-stage TD3 replay resume is intentionally unsupported.
td3_bc_dagger_checkpoint: null

algo:
  # Existing state-wise safety controller. Beta remains available for the
  # exact beta/hybrid categorical-source ablations.
  dagger_control_mode: safe
  dagger_safe_takeover_rms: 0.006
  dagger_safe_release_rms: 0.004
  dagger_safe_min_teacher_steps: 8
  dagger_safe_zero_iteration: null
  dagger_beta_start: 1.0
  dagger_beta_end: 0.0
  dagger_beta_zero_iteration: null
  dagger_beta_decay_rollouts: 1800
  dagger_seed: 0
  dagger_teacher_action_threshold: 20.0
  dagger_action_clip: 20.0

  # Exact existing valid-Teacher latent-coordinate SmoothL1 objective.
  dagger_bc_lr: 3.0e-4
  dagger_actor_huber_delta: 1.0
  dagger_buffer_capacity: 131_072
  dagger_buffer_device: cpu
  dagger_batch_size: 4096
  # Collection-only phase before the requested main DAgger budget. It keeps
  # collecting successful Teacher episodes until q_teacher_buffer_capacity is
  # full. This value is only a fail-fast safety ceiling for persistently bad
  # Teacher collection; it is not the normal prefill duration.
  # Prefill runs no Actor/Critic/perception update and never enters main replay.
  # Once full, this Teacher Q ring is frozen: main DAgger still computes Teacher
  # labels for BC, but does not copy more rows into the Teacher Q ring.
  # Rows are committed episode-wise only after command completion; physical
  # failure and timeout trajectories are discarded.
  teacher_prefill_max_rollouts: 1000
  # Shared source mix for Critic, Actor states, and perception supervision:
  # 50% live Student plus 50% frozen Teacher.  Within that Teacher half, 30%
  # is phase-focused, yielding total shares Student 50%, uniform Teacher 35%,
  # and failure-phase Teacher 15%.  Until a Student failure has supplied risk
  # phases, the focused 15% safely falls back to uniform Teacher sampling.
  teacher_actor_replay_fraction: 0.5
  teacher_perception_replay_fraction: 0.5
  failure_phase_teacher_fraction: 0.3
  # Each failed Student episode contributes ten evenly spaced reference-phase
  # samples from the inclusive [done - 50, done] interval.  The histogram is
  # phase-indexed rather than a second Student pre-failure replay partition.
  failure_phase_lookback_steps: 50
  failure_phase_samples_per_failure: 10
  failure_phase_num_bins: 1024
  dagger_replay_raw_observations: true
  replay_raw_observation_keys:
    - vel_command
    - policy
    - priv
    - command
    - depth
  # Replay stores perception inputs rather than collection-time priv_pred.
  # Both recurrent perception paths are rebuilt with current EMA weights over
  # this fixed finite history before Actor/target-Actor evaluation.
  perception_replay_burn_in: 8
  perception_encode_microbatch_size: 128
  teacher_perception_batch_size: 128
  perception_depth_codec: uint8_div_100_v1
  # Optional Student-perception warm start.  Keep this checkpoint separate
  # from checkpoint_path: the latter remains the train-phase PPO Teacher.
  # When enabled, the checkpoint must contain the complete online + EMA depth,
  # object-adaptation, and adaptation-module state expected by the backend.
  load_pretrained_perception: false
  perception_checkpoint_path: null
  # true: continue adapting perception on live/Teacher replay supervision.
  # false: freeze a successfully loaded pretrained perception stack.
  train_perception: true

  # Locked twin 501-atom critic topology and exact replay cadence.
  q_hidden_dim: 768
  q_num_atoms: 501
  q_v_min: -20.0
  q_v_max: 20.0
  q_layer_norm: true
  q_action_fusion: late
  q_normalize_actions: true
  q_action_input_gain: 1.0
  q_lr: 3.0e-5
  q_weight_decay: 1.0e-3
  q_seed: 0
  q_tau: 0.005
  q_max_grad_norm: 1.0
  q_batch_size: 512
  q_updates_per_rollout: 128
  q_teacher_replay_ratio: 0.5
  q_teacher_buffer_capacity: 131_072

  # Fixed Phase-1 objective and delayed deterministic update controls.
  eta_td3: 1.0
  lambda_bc: 1.0
  policy_delay: 2
  target_policy_noise_std: 0.2
  target_policy_noise_clip: 0.5
  collector_exploration_noise_std: 0.1
  collector_exploration_noise_clip: 0.5
  td3_learning_starts: 8192

  # Raw recurrent windows live only in the online learning rings.  No immutable
  # teacher H5 is exported or restored in this fresh-only version.
  save_teacher_buffer: false

wandb:
  project: vaic_dagger
